name: tele_flutter
description: Tele video calling for Flutter apps. A Tele API client acting as the signed-in user and a prebuilt call screen on livekit_client.
version: 0.2.0
repository: https://github.com/cloudguys-io/tele-flutter
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  livekit_client: ^2.13.1 # >= 2.12.0 is required for Bangla and emoji chat on lk.chat

dev_dependencies:
  dart_jsonwebtoken: ^3.4.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
